# Auto-generated by matugen from the current wallpaper — do not hand-edit.
# ANSI 1-6/9-14 use only matugen's native Material roles (primary/secondary/
# tertiary/error) — no [config.custom_colors] seeds. That's only 4 distinct
# hues, so magenta reuses secondary's hue (different tone than green) and
# cyan reuses tertiary's hue (different tone than yellow).
[colors.primary]
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"

[colors.cursor]
text = "{{colors.surface.default.hex}}"
cursor = "{{colors.primary.default.hex}}"

[colors.selection]
text = "{{colors.surface.default.hex}}"
background = "{{colors.primary.default.hex}}"

[colors.normal]
black = "{{colors.surface.default.hex}}"
red = "{{colors.error_container.default.hex}}"
green = "{{colors.secondary_container.default.hex}}"
yellow = "{{colors.tertiary_container.default.hex}}"
blue = "{{colors.primary_container.default.hex}}"
magenta = "{{colors.secondary_container.default.hex}}"
cyan = "{{colors.tertiary_container.default.hex}}"
white = "{{colors.on_surface.default.hex}}"

[colors.bright]
black = "{{colors.outline.default.hex}}"
red = "{{colors.error.default.hex}}"
green = "{{colors.secondary.default.hex}}"
yellow = "{{colors.tertiary.default.hex}}"
blue = "{{colors.primary.default.hex}}"
magenta = "{{colors.secondary.default.hex}}"
cyan = "{{colors.tertiary.default.hex}}"
white = "{{colors.on_surface.default.hex}}"
